query GetPopularAnime($page: Int, $perPage: Int) {
  Page(page: $page, perPage: $perPage) {
    pageInfo {
      currentPage
      hasNextPage
    }
    media(type: ANIME, sort: [POPULARITY_DESC]) {
      id
      title {
        english
        romaji
      }
      coverImage {
        large
        extraLarge
        color
      }
      averageScore
      genres
      duration
    }
  }
}
